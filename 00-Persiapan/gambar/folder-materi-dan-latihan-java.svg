<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Segoe UI', Arial, 'DejaVu Sans', sans-serif">
  <title>Folder materi dan folder latihan pribadi</title>
  <desc>Dua folder di dalam Documents: PBO2026 berisi materi yang hanya dibaca, dan PBO-latihan-saya berisi salinan yang boleh diubah. File Contoh01Halo.java disalin dari folder materi ke folder latihan.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <g id="ikon-folder">
      <path d="M0,6 a3,3 0 0 1 3,-3 h10 l4,4 h17 a3,3 0 0 1 3,3 v18 a3,3 0 0 1 -3,3 h-31 a3,3 0 0 1 -3,-3 z" />
    </g>
  </defs>
  <rect x="1" y="1" width="878" height="468" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="440" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">Aturan emas: materi dan latihanmu tinggal di folder berbeda</text>
  <text x="440" y="66" text-anchor="middle" font-size="15" fill="#57606a">Contoh susunan di dalam folder Documents</text>

  <!-- Kartu kiri: folder materi -->
  <rect x="30" y="86" width="370" height="290" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
  <use href="#ikon-folder" x="50" y="104" fill="#0969da"/>
  <text x="98" y="122" font-size="19" font-weight="700" fill="#0a3069">PBO2026</text>
  <text x="98" y="142" font-size="14" fill="#0a3069">folder materi (hanya dibaca)</text>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328">
    <text x="52" y="182">Pertemuan-01-Pengenalan-PBO/</text>
    <text x="72" y="206">java/</text>
    <text x="92" y="230">contoh/</text>
    <rect x="102" y="240" width="160" height="26" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="110" y="258">Contoh01Halo.java</text>
  </g>
  <text x="50" y="306" font-size="14" fill="#1f2328">Diperbarui lewat <tspan font-weight="700">git pull</tspan> atau unduh ulang.</text>
  <text x="50" y="328" font-size="14" fill="#1f2328">Jangan mengubah <tspan font-style="italic">file</tspan> di sini secara</text>
  <text x="50" y="350" font-size="14" fill="#1f2328">langsung.</text>

  <!-- Kartu kanan: folder latihan pribadi -->
  <rect x="480" y="86" width="370" height="290" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/>
  <use href="#ikon-folder" x="500" y="104" fill="#1a7f37"/>
  <text x="548" y="122" font-size="19" font-weight="700" fill="#044f1e">PBO-latihan-saya</text>
  <text x="548" y="142" font-size="14" fill="#044f1e">folder milikmu (bebas diubah)</text>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328">
    <text x="502" y="182">pertemuan-01/</text>
    <rect x="512" y="192" width="160" height="26" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="520" y="210">Contoh01Halo.java</text>
    <text x="520" y="236">Coba.java</text>
    <text x="502" y="262">pertemuan-02/</text>
    <text x="502" y="286">proyek-akhir/</text>
  </g>
  <text x="500" y="320" font-size="14" fill="#1f2328">Tempat mencoba, mengubah, dan</text>
  <text x="500" y="342" font-size="14" fill="#1f2328">menyimpan jawabanmu. Aman dari</text>
  <text x="500" y="364" font-size="14" fill="#1f2328">pembaruan materi.</text>

  <!-- Panah salin -->
  <path d="M262,253 C382,253 400,205 506,205" fill="none" stroke="#bc4c00" stroke-width="3" marker-end="url(#panah)"/>
  <rect x="404" y="164" width="72" height="24" rx="12" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="440" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#bc4c00">1. salin</text>

  <!-- Langkah -->
  <text x="440" y="408" text-anchor="middle" font-size="15" fill="#1f2328"><tspan font-weight="700" fill="#bc4c00">1.</tspan> Salin <tspan font-style="italic">file</tspan> yang ingin dicoba.<tspan dx="28" font-weight="700" fill="#bc4c00">2.</tspan> Buka salinannya, ubah, lalu jalankan.</text>
  <text x="440" y="440" text-anchor="middle" font-size="15" fill="#57606a">Hasilnya: materi asli tetap utuh, dan pembaruan materi tidak bentrok dengan pekerjaanmu.</text>
</svg>
